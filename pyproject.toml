[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfmwrapper"
version = "0.6.0"
description = "Python wrapper for the Reference Forward Model (RFM) radiative transfer code"
authors = [{name = "Jean-François Smekens"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["radiative-transfer", "atmosphere", "spectroscopy", "RFM", "FTIR"]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "openpyxl",
    "cmcrameri",
]

[project.scripts]
rfm-viewer = "rfmwrapper.rfm_viewer:launch"

[project.urls]
Repository = "https://github.com/jfsmekens/RFMwrapper"
Issues = "https://github.com/jfsmekens/RFMwrapper/issues"
"RFM" = "https://eodg.atm.ox.ac.uk/RFM/"

[tool.setuptools.packages.find]
where = ["."]
include = ["rfmwrapper*"]

[tool.setuptools.package-data]
rfmwrapper = ["standards.txt", "filters/*/*.csv", "instruments.json"]
